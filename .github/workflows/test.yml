name: Test HTMLExtensions

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET
        uses: EvotecIT/PSPublishModule/.github/actions/setup-dotnet@6d2eef9cb69e2d93f89e7f22e9c39fa294260d19
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Install browser through HtmlTinkerX
        env:
          HTMLTINKERX_PLAYWRIGHT_WITH_DEPS: 'true'
        run: dotnet run --project tests/browser/HTMLExtensions.Browser.csproj --configuration Release -- --install

      - name: Run regression tests
        run: npm test
