name: "Build & Release HTMLExtensions"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.6). If omitted, use tag name on push."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      BRANCH: master   # change to main if needed

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          # For npm Trusted Publishing (OIDC), avoid registry auth token wiring here.
          # npm CLI will request an OIDC token during `npm publish --provenance`.

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies (ci with lock, or create lockfile first)
        shell: bash
        run: |
          set -e
          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json; generating lockfile..."
            npm install --package-lock-only
          fi
          npm ci

      - name: Derive version from tag (if not provided)
        id: ver
        shell: bash
        run: |
          set -e
          VER="${{ inputs.version }}"
          if [ -z "$VER" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Check cross-repo workflow token availability
        id: token
        shell: bash
        env:
          CDNHFX_WORKFLOW_TOKEN: ${{ secrets.CDNHFX_WORKFLOW_TOKEN }}
        run: |
          if [ -n "${CDNHFX_WORKFLOW_TOKEN}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package.json version (if present)
        if: steps.ver.outputs.version != ''
        run: |
          if [ -f package.json ]; then
            node -e "let f='package.json',p=require('./'+f);p.version='${{ steps.ver.outputs.version }}';require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"
          fi

      - name: Lint/Format sources
        run: npm run format

      - name: Check formatting
        run: npm run format:check

      - name: Build dist
        run: npm run build

      - name: Copy dist into docs for site
        run: |
          mkdir -p docs/dist
          rsync -a --delete dist/ docs/dist/

      - name: Commit dist (and package.json if changed)
        run: |
          git config user.name  "evotec-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/ docs/dist/ package.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): dist for v$VERSION"
            git push origin HEAD:$BRANCH
          fi

      - name: Create tag (skip if exists) [workflow_dispatch only]
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists; skipping."
          else
            git tag -a "$TAG" -m "HTMLExtensions $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}"
          NAME="$TAG"

          mapfile -t ASSETS < <(find dist -type f | sort)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets found under dist/." >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$NAME"
          fi

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          if [ -f package.json ]; then
            # Force OIDC trusted publishing path (ignore any stale token env/registry auth)
            unset NODE_AUTH_TOKEN || true
            unset NPM_TOKEN || true
            npm config delete //registry.npmjs.org/:_authToken || true
            npm publish --provenance --access public
          else
            echo "package.json missing; skipping npm publish."
          fi

      - name: Dispatch HtmlForgeX HTMLExtensions sync
        if: steps.ver.outputs.version != '' && steps.token.outputs.has_token == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CDNHFX_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            repos/EvotecIT/HtmlForgeX/actions/workflows/sync-htmlextensions.yml/dispatches \
            -f ref=master \
            -F inputs[version]='${{ steps.ver.outputs.version }}'

      - name: Warn when cross-repo workflow token is missing
        if: steps.ver.outputs.version != '' && steps.token.outputs.has_token != 'true'
        shell: bash
        run: |
          echo "::warning::CDNHFX_WORKFLOW_TOKEN is not configured, so the HtmlForgeX HTMLExtensions sync workflow was not dispatched."
